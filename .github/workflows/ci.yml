name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Default fetch-depth is 1. Tests must not `git show` historical SHAs or
      # retired blobs — rewritten history and shallow clones will fail red.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Materialize dogfood for tests
        run: |
          rm -rf .cursor/rules .cursor/agents .cstl/scripts
          mkdir -p .cursor/rules .cursor/agents .cstl/scripts
          cp packages/cli/src/templates/cursor/rules/* .cursor/rules/
          cp packages/cli/src/templates/cursor/agents/* .cursor/agents/
          cp -r packages/cli/src/templates/trellis/scripts/* .cstl/scripts/

      - name: Test
        env:
          # task.py archive/create/start-execution need `cstl kernel --json`.
          # A clean runner has no global `cstl`; point at this checkout's bin.
          TRELLIS_KERNEL_CLI: node ${{ github.workspace }}/packages/cli/bin/cstl.js kernel --json
        run: pnpm test

      - name: Mirror-check
        run: pnpm mirror-check
