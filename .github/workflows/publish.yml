# Publish @blxzer/cursor-trellis-core and @blxzer/cursor-trellis to npm when a
# cursor-trellis release tag is pushed.
#
# Tag convention: cstl-v<semver> (NOT v<semver> — legacy @blxzer/trellis tags
# occupy v0.3.x–v0.6.x in this repo's history).
#
# Required repo secret: NPM_TOKEN (npm automation token with publish access to
# both @blxzer/cursor-trellis and @blxzer/cursor-trellis-core).
#
# Manual fallback (maintainer machine): node packages/cli/scripts/publish-packages.js

name: Publish

on:
  push:
    tags:
      - "cstl-v*"

# contents: write — GitHub Release on the same tag (Latest was stuck on 0.3.4
# when only npm published). Do not drop this back to read.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Same shallow-clone contract as CI: no historical `git show` in tests.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize dogfood for tests
        run: |
          rm -rf .cursor/rules .cursor/agents .cstl/scripts
          mkdir -p .cursor/rules .cursor/agents .cstl/scripts
          cp packages/cli/src/templates/cursor/rules/* .cursor/rules/
          cp packages/cli/src/templates/cursor/agents/* .cursor/agents/
          cp -r packages/cli/src/templates/trellis/scripts/* .cstl/scripts/

      - name: Verify tag matches package versions
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Prepare GitHub Release notes from CHANGELOG
        run: |
          export NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          node <<'NODE'
          const fs = require("node:fs");
          const version = JSON.parse(
            fs.readFileSync("packages/cli/package.json", "utf8"),
          ).version;
          const text = fs.readFileSync("packages/cli/CHANGELOG.md", "utf8");
          const header = `## [${version}]`;
          const start = text.indexOf(header);
          if (start < 0) {
            console.error(`CHANGELOG.md has no ${header} section`);
            process.exit(1);
          }
          const rest = text.slice(start);
          const next = rest.indexOf("\n## [", 1);
          const notes = `${(next < 0 ? rest : rest.slice(0, next)).trim()}\n`;
          fs.writeFileSync(process.env.NOTES_FILE, notes);
          NODE

      - name: Verify packed CLI resolves core dependency
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Publish core then cli
        run: node packages/cli/scripts/publish-packages.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # cli prepublishOnly runs tests. Archive/create/start-execution call
          # Kernel; without this, core publishes and cli fails (0.4.3 incident).
          TRELLIS_KERNEL_CLI: node ${{ github.workspace }}/packages/cli/bin/cstl.js kernel --json

      - name: Verify npm registry visibility
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          TAG="${GITHUB_REF_NAME}"
          TITLE="$(node -p "require('./packages/cli/package.json').version")"
          # Prerelease (semver contains '-') must be --prerelease so GitHub
          # does not steal Latest from the last stable tag. Stable uses --latest.
          RELEASE_FLAGS="--latest"
          if [ "$(node -p "/-/.test(require('./packages/cli/package.json').version)")" = "true" ]; then
            RELEASE_FLAGS="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}" --title "${TITLE}" ${RELEASE_FLAGS}
          else
            gh release create "${TAG}" \
              --verify-tag \
              --notes-file "${NOTES_FILE}" \
              --title "${TITLE}" \
              ${RELEASE_FLAGS}
          fi
