# Publish the two canonical Pactile packages and two 0.5.x compatibility shims
# to npm when a Pactile release tag is pushed. Stable versions are published
# under the temporary `candidate` dist-tag; a separate manual promotion job
# moves an already-verified version to `latest` and creates the GitHub Release.
#
# Tag convention: pactile-v<semver>. Earlier tag families remain immutable
# history and are never reused for new releases.
#
# Required repo secret: NPM_TOKEN (npm automation token with publish access to
# the complete four-package release set).
#
# Manual fallback uses the same two-process credential wall: run
# `publish-packages.js --prepare-only --receipt-output <outside-artifact-file>`
# without a token, then pass that file's `manifest_sha256` value explicitly to
# `publish-packages.js --publish-only --expected-manifest-sha256 <value>`.

name: Publish

on:
  push:
    tags:
      - "pactile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to promote (for example 0.5.0)"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE to authorize dist-tag, deprecation, and release actions"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pactile-v') }}
    runs-on: ubuntu-latest
    steps:
      # Publish provenance needs the tag commit plus release branch ancestry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Candidate preparation needs history, never a persisted write-capable token.
          persist-credentials: false

      - name: Verify exact tag and commit provenance
        run: >-
          node packages/cli/scripts/release-preflight.js check-provenance
          --tag "${GITHUB_REF_NAME}" --remote origin

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize dogfood for release validation
        run: |
          rm -rf .cursor/rules .cursor/agents .pactile/scripts
          mkdir -p .cursor/rules .cursor/agents .pactile/scripts
          cp packages/cli/src/templates/cursor/rules/* .cursor/rules/
          cp packages/cli/src/templates/cursor/agents/* .cursor/agents/
          cp -r packages/cli/src/templates/pactile/scripts/* .pactile/scripts/

      - name: Ignore package-manager executable-bit normalization
        run: git config core.filemode false

      - name: Select npm dist-tag
        id: npm-tag
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "value=candidate" >> "$GITHUB_OUTPUT"
            echo "args=--npm-tag candidate" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node packages/cli/scripts/release-preflight.js npm-tag)" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate candidate and prepare immutable tarballs
        id: prepare
        run: |
          node packages/cli/scripts/publish-packages.js \
            --prepare-only --artifact-dir "${RUNNER_TEMP}/release-artifacts" \
            --receipt-output "${GITHUB_OUTPUT}" \
            --tag "${GITHUB_REF_NAME}" --remote origin \
            ${{ steps.npm-tag.outputs.args }}
        env:
          # Candidate tests call Kernel before either package is published.
          PACTILE_KERNEL_CLI: node ${{ github.workspace }}/packages/cli/bin/pactile.js kernel --json

      - name: Publish verified tarballs
        run: >-
          node packages/cli/scripts/publish-packages.js
          --publish-only --artifact-dir "${RUNNER_TEMP}/release-artifacts"
          --expected-manifest-sha256 "${{ steps.prepare.outputs.manifest_sha256 }}"
          --tag "${GITHUB_REF_NAME}"
        env:
          # The publish token exists only in this minimal artifact-consumer step.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry visibility
        run: >-
          node packages/cli/scripts/release-preflight.js verify-npm --package all
          --npm-tag "${{ steps.npm-tag.outputs.value }}"

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PROMOTE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate stable version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be a stable X.Y.Z semver" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: pactile-v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify stable tag and package versions
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag --tag "pactile-v${VERSION}"

      - name: Verify every package is staged under candidate
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in \
            @blxzer/pactile-core \
            @blxzer/pactile \
            @blxzer/cursor-trellis-core \
            @blxzer/cursor-trellis; do
            staged="$(npm view "${package_name}@candidate" version --json)"
            if [[ "$staged" != "\"$VERSION\"" && "$staged" != "$VERSION" ]]; then
              echo "${package_name}@candidate resolves to $staged, expected $VERSION" >&2
              exit 1
            fi
          done

      - name: Promote canonical packages to latest
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm dist-tag add "@blxzer/pactile-core@$VERSION" latest
          npm dist-tag add "@blxzer/pactile@$VERSION" latest

      - name: Promote legacy shims to latest
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm dist-tag add "@blxzer/cursor-trellis-core@$VERSION" latest
          npm dist-tag add "@blxzer/cursor-trellis@$VERSION" latest

      - name: Verify latest points to the promoted version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in \
            @blxzer/pactile-core \
            @blxzer/pactile \
            @blxzer/cursor-trellis-core \
            @blxzer/cursor-trellis; do
            latest="$(npm view "${package_name}@latest" version --json)"
            if [[ "$latest" != "\"$VERSION\"" && "$latest" != "$VERSION" ]]; then
              echo "${package_name}@latest resolves to $latest, expected $VERSION" >&2
              exit 1
            fi
          done

      - name: Deprecate pre-Pactile shim versions
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm deprecate "@blxzer/cursor-trellis-core@<$VERSION" \
            "Use @blxzer/pactile-core@$VERSION; the legacy package remains a compatibility bridge."
          npm deprecate "@blxzer/cursor-trellis@<$VERSION" \
            "Use @blxzer/pactile@$VERSION; the legacy package remains a compatibility bridge."

      - name: Remove temporary candidate dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in \
            @blxzer/pactile-core \
            @blxzer/pactile \
            @blxzer/cursor-trellis-core \
            @blxzer/cursor-trellis; do
            if npm view "${package_name}@candidate" version --json >/dev/null 2>&1; then
              npm dist-tag rm "$package_name" candidate
            else
              echo "${package_name} has no candidate tag; continuing"
            fi
          done

      - name: Create GitHub Latest Release last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/pactile-release-notes.md"
          node - "$notes_file" <<'NODE'
          const fs = require("node:fs");
          const output = process.argv[2];
          const version = JSON.parse(fs.readFileSync("packages/cli/package.json", "utf8")).version;
          const text = fs.readFileSync("packages/cli/CHANGELOG.md", "utf8");
          const start = text.indexOf(`## [${version}]`);
          if (start < 0) throw new Error(`CHANGELOG.md has no ## [${version}] section`);
          const rest = text.slice(start);
          const next = rest.indexOf("\n## [", 1);
          fs.writeFileSync(output, `${(next < 0 ? rest : rest.slice(0, next)).trim()}\n`);
          NODE
          if gh release view "pactile-v${VERSION}" >/dev/null 2>&1; then
            gh release edit "pactile-v${VERSION}" \
              --title "$VERSION" --notes-file "$notes_file" --latest
          else
            gh release create "pactile-v${VERSION}" --verify-tag \
              --title "$VERSION" --notes-file "$notes_file" --latest
          fi
